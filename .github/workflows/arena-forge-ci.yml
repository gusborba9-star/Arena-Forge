 name: Arena Forge CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - run: godot --headless --path game --script tests/engine_contract_runner.gd
