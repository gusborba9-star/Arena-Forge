name: Arena Forge CI
on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Godot project registry
        run: godot --headless --editor --path game --quit
      - name: Verify Godot runner exit contract
        shell: bash
        run: |
          set +e
          godot --headless --path game --script tests/support/runner_exit_pass_contract_runner.gd
          pass_code=$?
          godot --headless --path game --script tests/support/runner_exit_fail_contract_runner.gd
          fail_code=$?
          echo "RUNNER_EXIT_CONTRACT pass_exit=$pass_code expected=0 fail_exit=$fail_code expected=1"
          test "$pass_code" -eq 0
          test "$fail_code" -eq 1
      - name: Run engine contracts
        run: godot --headless --path game --script tests/engine_contract_runner.gd
      - name: Run card data contracts
        run: godot --headless --path game --script tests/card_data_contract_runner.gd
      - name: Run card runtime contracts
        run: godot --headless --path game --script tests/card_runtime_contract_runner.gd
      - name: Run card guard contracts
        run: godot --headless --path game --script tests/card_guard_contract_runner.gd
      - name: Run content foundation contracts
        run: godot --headless --path game --script tests/content_foundation_contract_runner.gd
      - name: Run content expansion scale contracts
        run: godot --headless --path game --script tests/content_expansion_scale_contract_runner.gd
      - name: Run Forge War foundation contracts
        run: godot --headless --path game --script tests/forge_war_foundation_contract_runner.gd
      - name: Run A1 runtime contracts
        run: godot --headless --path game --script tests/a1_runtime_contract_runner.gd
      - name: Run bootstrap smoke contract
        run: godot --headless --path game --script tests/bootstrap_smoke_runner.gd
